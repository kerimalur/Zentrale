name: ZentraleOS bauen und testen
on:
  push:
    branches: [os-nacht]
    tags: ['os-nacht-*']
    paths: ['os/**', '.github/workflows/os-nacht.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Werkzeuge
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf qemu-utils xorriso swtpm swtpm-tools
      - name: ISO bauen
        run: ZOS_CPUS=4 ZOS_RAM=12g os/bauen.sh
      - name: VM-Tests (QEMU mit KVM)
        run: os/testen.sh
      - name: Ergebnisse (Bilder, Protokolle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-test
          path: |
            os/ausgabe/test/
            os/ausgabe/bau.log
      - name: ISO als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zentraleos-iso
          path: |
            os/ausgabe/zentraleos.iso
            os/ausgabe/zentraleos.iso.sha256
          compression-level: 0
      - name: Release (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/os-nacht-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            os/ausgabe/zentraleos.iso
            os/ausgabe/zentraleos.iso.sha256
          prerelease: true
