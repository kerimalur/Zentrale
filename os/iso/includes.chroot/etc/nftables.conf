#!/usr/sbin/nft -f
# Von ZentraleOS erzeugt. Änderungen über Einstellungen → Firewall.
# ZOS-KONFIG {"an":true,"profil":"zuhause","killswitch":false,"regeln":[]}
flush ruleset
table inet zentraleos {
  set gesperrt4 { type ipv4_addr; flags timeout; }
  set gesperrt6 { type ipv6_addr; flags timeout; }
  chain eingang {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ip saddr @gesperrt4 drop
    ip6 saddr @gesperrt6 drop
    ct state established,related accept
    ct state invalid drop
    iifname "tailscale0" accept
    udp dport 41641 accept
    meta l4proto { icmp, ipv6-icmp } accept
    udp dport { 68, 546 } accept
    udp dport 5353 accept
    limit rate 10/second log prefix "ZOS-VERWORFEN " level info
  }
  chain weiter { type filter hook forward priority 0; policy drop; }
  chain ausgang { type filter hook output priority 0; policy accept; }
}
