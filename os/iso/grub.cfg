source /boot/grub/config.cfg
set timeout=5

menuentry "ZentraleOS starten" --hotkey=z {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}
menuentry "ZentraleOS – sicherer Grafikmodus (wenn der Bildschirm schwarz bleibt)" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset zos.pixman
	initrd	@INITRD_LIVE@
}
menuentry "Wartung – Konsole (Anmeldung mit Benutzer und Passwort)" --hotkey=w {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ systemd.unit=multi-user.target nosplash
	initrd	@INITRD_LIVE@
}
if [ "${grub_platform}" = "efi" ]; then
	menuentry "UEFI-Einstellungen" --hotkey=f {
		fwsetup
	}
fi
